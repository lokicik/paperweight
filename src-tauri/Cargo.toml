[package]
name = "paperweight"
version = "0.1.0"
description = "See what makes a PDF heavy and make a smaller, verified copy"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
rfd = "0.16"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
