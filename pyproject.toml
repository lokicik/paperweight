[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperweight-engine"
version = "0.1.0"
description = "Local PDF space accounting, previews and verified compression for Paperweight"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = ["PyMuPDF==1.28.2", "pypdf==6.19.0", "Pillow==12.3.0"]

[project.scripts]
paperweight = "paperweight.server:main"

[tool.setuptools.packages.find]
where = ["backend"]
